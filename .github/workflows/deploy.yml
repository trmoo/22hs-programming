name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 실행은 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # C 예제를 실제로 컴파일해 기대 출력과 대조하려면 컴파일러가 필요하다.
      # zig cc 는 clang 을 그대로 쓰며 내려받기가 빠르다 (tools/check-examples.mjs).
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - run: npm ci

      # 실행기가 실제로 잡히는지 먼저 찍어 둔다.
      # check:examples 가 예제를 "미검증"으로 넘기면 조용히 지나가므로,
      # 로그에서 python·zig 유무를 눈으로 확인할 수 있어야 한다.
      - name: 실행기 확인
        run: |
          echo "node  $(node --version)"
          echo "python3 $(python3 --version 2>&1 || echo 없음)"
          echo "python  $(python --version 2>&1 || echo 없음)"
          echo "zig     $(zig version 2>&1 || echo 없음)"

      # 빌드가 곧 검사다 (CLAUDE.md 7장). 한 덩어리로 돌리면 로그를 못 볼 때
      # 어느 단계가 깨졌는지 알 수 없어서, 단계마다 따로 돌린다.
      - name: 1. check:data — 성취기준 매핑·커버리지
        run: npm run check:data

      - name: 2. check:content — 본문 ↔ curriculum.json 이중 확인
        run: npm run check:content

      - name: 3. check:toc — 목차 강조 판정
        run: npm run check:toc

      - name: 4. check:examples — 예제 코드 실제 실행
        run: npm run check:examples

      - name: 5. astro build — 정적 생성
        run: npx astro build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: 6. check:html — 산출물 전수 검사
        run: npm run check:html
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        # 저장소마다 Actions 기본 권한이 달라 Pages 자동 활성화가 거부될 수 있다.
        # 그때는 Settings → Pages → Source 를 "GitHub Actions" 로 한 번만 바꾼다.
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
